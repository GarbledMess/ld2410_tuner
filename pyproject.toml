[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.coverage.run]
source = ["custom_components/ld2410_tuner", "tools"]
core = "sysmon"  # Far cheaper than tracing a home's worth of Learn.

[tool.coverage.report]
fail_under = 85
show_missing = true
