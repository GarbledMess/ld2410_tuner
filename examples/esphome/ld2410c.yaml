      name: Timeout
      device_id: ${ld2410_device_id}
    max_move_distance_gate:
      id: ${ld2410_id}_max_move
      name: Max Move Distance
      device_id: ${ld2410_device_id}
    max_still_distance_gate:
      id: ${ld2410_id}_max_still
      name: Max Still Distance
      device_id: ${ld2410_device_id}
    g0:
      move_threshold:
        id: ${ld2410_id}_g0_move
        name: G0 Move Threshold
        device_id: ${ld2410_device_id}
      still_threshold:
        id: ${ld2410_id}_g0_still
        name: G0 Still Threshold
        device_id: ${ld2410_device_id}
    g1:
      move_threshold:
        id: ${ld2410_id}_g1_move
        name: G1 Move Threshold
        device_id: ${ld2410_device_id}
      still_threshold:
        id: ${ld2410_id}_g1_still
        name: G1 Still Threshold
        device_id: ${ld2410_device_id}
    g2:
      move_threshold:
        id: ${ld2410_id}_g2_move
        name: G2 Move Threshold
        device_id: ${ld2410_device_id}
      still_threshold:
        id: ${ld2410_id}_g2_still
