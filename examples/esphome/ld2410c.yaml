        on_value:
          - lambda: id(${ld2410_id}_g6_still).publish_state(x);
    g7:
      move_threshold:
        id: ${ld2410_id}_g7_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g7_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g7_still_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g7_still).publish_state(x);
    g8:
      move_threshold:
        id: ${ld2410_id}_g8_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g8_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g8_still_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g8_still).publish_state(x);

  # Public controls round writes; internal driver numbers preserve actual readback.
  - platform: template
    id: ${ld2410_id}_g0_move
    name: G0 Move Threshold
    device_id: ${ld2410_device_id}
    min_value: 0
    max_value: 100
    step: ${ld2410_gate_rounding}
    update_interval: never
    lambda: return id(${ld2410_id}_g0_move_raw).state;
    set_action:
      - number.set:
          id: ${ld2410_id}_g0_move_raw
          value: !lambda |-
            const float minimum = id(${ld2410_id}_g0_move).traits.get_min_value();
            const float maximum = id(${ld2410_id}_g0_move).traits.get_max_value();
            const float increment = id(${ld2410_id}_g0_move).traits.get_step();
            const float last = minimum + floorf((maximum - minimum) / increment) * increment;
            const float rounded = minimum + roundf((x - minimum) / increment) * increment;
            return fminf(last, fmaxf(minimum, rounded));

  - platform: template
    id: ${ld2410_id}_g0_still
    name: G0 Still Threshold
    device_id: ${ld2410_device_id}
