        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g3_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g3_still_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g3_still).publish_state(x);
    g4:
      move_threshold:
        id: ${ld2410_id}_g4_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g4_move).publish_state(x);
      still_threshold:
