            const float minimum = id(${ld2410_id}_g0_still).traits.get_min_value();
            const float maximum = id(${ld2410_id}_g0_still).traits.get_max_value();
            const float increment = id(${ld2410_id}_g0_still).traits.get_step();
            const float last = minimum + floorf((maximum - minimum) / increment) * increment;
