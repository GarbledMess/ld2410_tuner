            const float minimum = id(${ld2410_id}_g8_still).traits.get_min_value();
            const float maximum = id(${ld2410_id}_g8_still).traits.get_max_value();
            const float increment = id(${ld2410_id}_g8_still).traits.get_step();
            const float last = minimum + floorf((maximum - minimum) / increment) * increment;
            const float rounded = minimum + roundf((x - minimum) / increment) * increment;
            const float nominal = fminf(last, fmaxf(minimum, rounded));
            // Integer radar threshold: first raw value in the displayed rounding band must pass.
            return nominal <= 0.0f ? 0.0f : fmaxf(0.0f, ceilf(nominal - increment / 2.0f) - 1.0f);

  # Saved runtime control. Changing it refreshes HA metadata, without radar writes.
  - platform: template
    id: ${ld2410_id}_gate_rounding
    name: ${ld2410_name_prefix}Gate Rounding
    device_id: ${ld2410_device_id}
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${ld2410_gate_rounding}
    on_value:
      - lambda: |-
          // Normalize fractional API writes to the same integer shown in HA.
          const float increment = roundf(x);
          if (increment != x) {
            id(${ld2410_id}_gate_rounding).publish_state(increment);
            return;
          }
          number::Number *gates[] = {
            id(${ld2410_id}_g0_move),
            id(${ld2410_id}_g0_still),
            id(${ld2410_id}_g1_move),
            id(${ld2410_id}_g1_still),
            id(${ld2410_id}_g2_move),
            id(${ld2410_id}_g2_still),
            id(${ld2410_id}_g3_move),
            id(${ld2410_id}_g3_still),
            id(${ld2410_id}_g4_move),
            id(${ld2410_id}_g4_still),
            id(${ld2410_id}_g5_move),
            id(${ld2410_id}_g5_still),
            id(${ld2410_id}_g6_move),
            id(${ld2410_id}_g6_still),
            id(${ld2410_id}_g7_move),
            id(${ld2410_id}_g7_still),
            id(${ld2410_id}_g8_move),
            id(${ld2410_id}_g8_still)
          };
          // Capture caller overrides once, before changing any runtime traits.
          static const float configured_steps[] = {
            id(${ld2410_id}_g0_move).traits.get_step(),
            id(${ld2410_id}_g0_still).traits.get_step(),
            id(${ld2410_id}_g1_move).traits.get_step(),
            id(${ld2410_id}_g1_still).traits.get_step(),
            id(${ld2410_id}_g2_move).traits.get_step(),
            id(${ld2410_id}_g2_still).traits.get_step(),
            id(${ld2410_id}_g3_move).traits.get_step(),
            id(${ld2410_id}_g3_still).traits.get_step(),
            id(${ld2410_id}_g4_move).traits.get_step(),
            id(${ld2410_id}_g4_still).traits.get_step(),
            id(${ld2410_id}_g5_move).traits.get_step(),
            id(${ld2410_id}_g5_still).traits.get_step(),
            id(${ld2410_id}_g6_move).traits.get_step(),
            id(${ld2410_id}_g6_still).traits.get_step(),
            id(${ld2410_id}_g7_move).traits.get_step(),
            id(${ld2410_id}_g7_still).traits.get_step(),
            id(${ld2410_id}_g8_move).traits.get_step(),
            id(${ld2410_id}_g8_still).traits.get_step()
          };
          for (size_t i = 0; i < 18; i++) {
            const float step = configured_steps[i] == ${ld2410_gate_rounding}
                ? increment : configured_steps[i];
            gates[i]->traits.set_step(step);
          }
          static float previous = NAN;
          const bool changed = std::isfinite(previous) && previous != increment;
          previous = increment;
          if (changed) id(${ld2410_id}_refresh_rounding_metadata).execute();

select:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    distance_resolution:
      id: ${ld2410_id}_distance_resolution
      name: ${ld2410_name_prefix}Distance Resolution
      device_id: ${ld2410_device_id}
    baud_rate:
      id: ${ld2410_id}_baud_rate
      name: ${ld2410_name_prefix}Baud Rate
      device_id: ${ld2410_device_id}

switch:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    engineering_mode:
      id: ${ld2410_id}_engineering_mode
      name: ${ld2410_name_prefix}Engineering Mode
      device_id: ${ld2410_device_id}
    bluetooth:
      id: ${ld2410_id}_bluetooth
      name: ${ld2410_name_prefix}Bluetooth
      device_id: ${ld2410_device_id}
      on_state:
        - if:
            condition:
              lambda: return !id(${ld2410_id}_bluetooth_default_applied);
            then:
              - globals.set:
                  id: ${ld2410_id}_bluetooth_default_applied
                  value: 'true'
              - if:
                  condition:
                    lambda: return x && ${ld2410_bluetooth_default_off};
                  then:
                    - logger.log: "Turning off LD2410 Bluetooth (ld2410_bluetooth_default_off)"
                    - switch.turn_off: ${ld2410_id}_bluetooth

text_sensor:
  - platform: template
    id: ${ld2410_id}_recovery_status
    name: ${ld2410_name_prefix}LD2410 Recovery Status
    device_id: ${ld2410_device_id}
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (id(${ld2410_id}_configuration_ready).state) return {"Settings available"};
      if (id(${ld2410_id}_recovery_paused)) return {"Paused after failed recovery; use Retry Radar Recovery"};
      if (id(${ld2410_id}_recover_parameters).is_running()) return {"Recovering missing settings"};
      return {"Waiting for settings"};
  # Set by the presence capture: gates over threshold, with value>threshold, in the
  # frame that found or lost presence.
  - platform: template
    id: ${ld2410_id}_presence_found_gates
    name: ${ld2410_name_prefix}Presence Found Gates
    device_id: ${ld2410_device_id}
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: ${ld2410_id}_presence_lost_gates
    name: ${ld2410_name_prefix}Presence Lost Gates
    device_id: ${ld2410_device_id}
    entity_category: diagnostic
    update_interval: never
  # Read-only metadata: these use the exact substitutions wired to the existing
  # filters above. Exposing them does not alter presence or add a new handler.
  - platform: template
    name: ${ld2410_name_prefix}LD2410 Presence On Delay
    device_id: ${ld2410_device_id}
    id: ${ld2410_id}_presence_on_delay_info
    entity_category: diagnostic
    lambda: return {"${ld2410_presence_on_delay}"};
    update_interval: 60s
  - platform: template
    name: ${ld2410_name_prefix}LD2410 Presence Off Delay
    device_id: ${ld2410_device_id}
    id: ${ld2410_id}_presence_off_delay_info
    entity_category: diagnostic
    lambda: return {"${ld2410_presence_off_delay}"};
    update_interval: 60s
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    version:
      id: ${ld2410_id}_firmware_version
      name: ${ld2410_name_prefix}Firmware Version
      device_id: ${ld2410_device_id}
    mac_address:
      id: ${ld2410_id}_mac_address
      name: ${ld2410_name_prefix}Mac Address
      device_id: ${ld2410_device_id}

button:
  - platform: template
    id: ${ld2410_id}_retry_recovery
    name: ${ld2410_name_prefix}Retry Radar Recovery
    device_id: ${ld2410_device_id}
    entity_category: config
    on_press:
      - if:
          condition:
            not:
              script.is_running: ${ld2410_id}_recover_parameters
          then:
            - globals.set:
                id: ${ld2410_id}_recovery_paused
                value: 'false'
            - script.execute: ${ld2410_id}_recover_parameters
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    query_params:
      id: ${ld2410_id}_query_params
      name: ${ld2410_name_prefix}Query Params
      device_id: ${ld2410_device_id}
    restart:
      id: ${ld2410_id}_radar_restart
      name: ${ld2410_name_prefix}Radar Restart
      device_id: ${ld2410_device_id}

globals:
  - id: ${ld2410_id}_recovery_paused
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${ld2410_id}_recovery_restarted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${ld2410_id}_last_recovery_restart
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Set once the timeout default has been applied; kept in flash for good.
  - id: ${ld2410_id}_timeout_default_applied
    type: bool
    restore_value: true
    initial_value: 'false'
  # Set once the radar first reports its Bluetooth state after boot.
  - id: ${ld2410_id}_bluetooth_default_applied
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${ld2410_id}_restore_engineering
    type: bool
    restore_value: false
    initial_value: 'false'
  # Radar presence seen by the last capture; -1 until the first frame.
  - id: ${ld2410_id}_last_presence
    type: int
    restore_value: false
    initial_value: '-1'

script:
  - id: ${ld2410_id}_recover_parameters
    mode: single
    then:
      - if:
          condition:
            lambda: return id(${ld2410_id}_recovery_paused);
          then:
            - script.stop: ${ld2410_id}_recover_parameters
      - delay: 5s
      - repeat: &ld2410_parameter_retries
          count: 3
          then:
            - if:
                condition:
                  binary_sensor.is_off: ${ld2410_id}_configuration_ready
                then:
                  - button.press: ${ld2410_id}_query_params
                  - delay: 2s
      - if:
          condition:
            and:
              - binary_sensor.is_off: ${ld2410_id}_configuration_ready
              - lambda: |-
                  return !id(${ld2410_id}_recovery_restarted)
                      || uint32_t(millis() - id(${ld2410_id}_last_recovery_restart)) >= 60000U;
          then:
            # Start the cooldown before sending, even if the UART is broken.
            # A recurring fault can recover again without rebooting the ESP.
            - globals.set:
                id: ${ld2410_id}_recovery_restarted
                value: 'true'
            - globals.set:
                id: ${ld2410_id}_last_recovery_restart
                value: !lambda return millis();
            - globals.set:
                id: ${ld2410_id}_restore_engineering
                value: !lambda return id(${ld2410_id}_engineering_mode).state;
            - logger.log:
                level: WARN
                format: "LD2410 settings missing; attempting radar restart"
            - button.press: ${ld2410_id}_radar_restart
            # The driver schedules its own reread after one second. Let it
            # finish before sending any further configuration commands.
            - delay: 3s
            - if:
                condition:
                  lambda: return id(${ld2410_id}_restore_engineering);
                then:
                  - switch.turn_on: ${ld2410_id}_engineering_mode
                  - delay: 1s
            - repeat: *ld2410_parameter_retries
      - if:
          condition:
            binary_sensor.is_off: ${ld2410_id}_configuration_ready
          then:
            - globals.set:
                id: ${ld2410_id}_recovery_paused
                value: 'true'
            - logger.log:
                level: WARN
                format: "LD2410 recovery failed; automatic commands paused until settings return or Retry Radar Recovery is pressed"

  # HA retrieves min/max/step when connecting; reconnect after a runtime change.
  - id: ${ld2410_id}_refresh_rounding_metadata
    mode: restart
    then:
      - delay: 500ms
      # Allow the throttle to expire before replaying unchanged raw readings.
      - delay: ${ld2410_gate_throttle}
      - lambda: |-
          sensor::Sensor *gates[] = {
            id(${ld2410_id}_g0_move_energy),
            id(${ld2410_id}_g0_still_energy),
            id(${ld2410_id}_g1_move_energy),
            id(${ld2410_id}_g1_still_energy),
            id(${ld2410_id}_g2_move_energy),
            id(${ld2410_id}_g2_still_energy),
            id(${ld2410_id}_g3_move_energy),
            id(${ld2410_id}_g3_still_energy),
            id(${ld2410_id}_g4_move_energy),
            id(${ld2410_id}_g4_still_energy),
            id(${ld2410_id}_g5_move_energy),
            id(${ld2410_id}_g5_still_energy),
            id(${ld2410_id}_g6_move_energy),
            id(${ld2410_id}_g6_still_energy),
            id(${ld2410_id}_g7_move_energy),
            id(${ld2410_id}_g7_still_energy),
            id(${ld2410_id}_g8_move_energy),
            id(${ld2410_id}_g8_still_energy)
          };
          for (auto *gate : gates) {
            if (gate->has_state()) gate->publish_state(gate->get_raw_state());
          }
      - delay: 100ms
      - lambda: |-
          #ifdef USE_API
          if (api::global_api_server != nullptr) {
            for (const auto &client : api::global_api_server->active_clients()) {
              api::DisconnectRequest request;
              if (!client->send_message(request)) client->on_fatal_error();
            }
          }
          #endif

  # Runs after the whole frame: the driver publishes the targets before the gates, and
  # moving before still, so a moving-to-still handover is not an edge.
  - id: ${ld2410_id}_capture_presence_edge
    mode: restart
    then:
      - delay: 0s
      - lambda: |-
          const int present = id(${ld2410_id}_moving_target).state || id(${ld2410_id}_still_target).state;
          const int previous = id(${ld2410_id}_last_presence);
          id(${ld2410_id}_last_presence) = present;
          if (previous < 0 || previous == present) return;
          sensor::Sensor *gates[] = {
            id(${ld2410_id}_g0_move_energy),
            id(${ld2410_id}_g0_still_energy),
            id(${ld2410_id}_g1_move_energy),
            id(${ld2410_id}_g1_still_energy),
            id(${ld2410_id}_g2_move_energy),
            id(${ld2410_id}_g2_still_energy),
            id(${ld2410_id}_g3_move_energy),
            id(${ld2410_id}_g3_still_energy),
            id(${ld2410_id}_g4_move_energy),
            id(${ld2410_id}_g4_still_energy),
            id(${ld2410_id}_g5_move_energy),
            id(${ld2410_id}_g5_still_energy),
            id(${ld2410_id}_g6_move_energy),
            id(${ld2410_id}_g6_still_energy),
            id(${ld2410_id}_g7_move_energy),
            id(${ld2410_id}_g7_still_energy),
            id(${ld2410_id}_g8_move_energy),
            id(${ld2410_id}_g8_still_energy)
          };
          bool captured = false;
          for (auto *gate : gates) captured = captured || std::isfinite(gate->get_raw_state());
          if (!captured) return;  // Engineering Mode off: no gate energies to judge.
          number::Number *thresholds[] = {
            id(${ld2410_id}_g0_move_raw),
            id(${ld2410_id}_g0_still_raw),
            id(${ld2410_id}_g1_move_raw),
            id(${ld2410_id}_g1_still_raw),
            id(${ld2410_id}_g2_move_raw),
            id(${ld2410_id}_g2_still_raw),
            id(${ld2410_id}_g3_move_raw),
            id(${ld2410_id}_g3_still_raw),
            id(${ld2410_id}_g4_move_raw),
            id(${ld2410_id}_g4_still_raw),
            id(${ld2410_id}_g5_move_raw),
            id(${ld2410_id}_g5_still_raw),
            id(${ld2410_id}_g6_move_raw),
            id(${ld2410_id}_g6_still_raw),
            id(${ld2410_id}_g7_move_raw),
            id(${ld2410_id}_g7_still_raw),
            id(${ld2410_id}_g8_move_raw),
            id(${ld2410_id}_g8_still_raw)
          };
          auto *max_move = id(${ld2410_id}_max_move);
          auto *max_still = id(${ld2410_id}_max_still);
          bool known = max_move->has_state() && std::isfinite(max_move->state)
              && max_still->has_state() && std::isfinite(max_still->state);
          for (auto *threshold : thresholds) {
            known = known && threshold->has_state() && std::isfinite(threshold->state);
          }
          auto *list = present ? id(${ld2410_id}_presence_found_gates) : id(${ld2410_id}_presence_lost_gates);
          if (!known) {
            list->publish_state("Settings unavailable");
            return;
          }
          // Home Assistant rejects states over 255 characters; count what does not fit.
          std::string over;
          int more = 0;
          for (int i = 0; i < 18; i++) {
            const float value = gates[i]->get_raw_state();
            const float threshold = thresholds[i]->state;
            const float max_gate = i % 2 ? max_still->state : max_move->state;
            if (!std::isfinite(value) || !(value > threshold) || i / 2 > max_gate) continue;
            const std::string entry = "G" + std::to_string(i / 2) + (i % 2 ? " Still " : " Move ")
                + std::to_string(static_cast<int>(value)) + ">" + std::to_string(static_cast<int>(threshold));
            if (more || over.size() + entry.size() + 2 > 255 - 10) {
              more++;
              continue;
            }
            if (!over.empty()) over += ", ";
            over += entry;
          }
          if (more) over += ", +" + std::to_string(more) + " more";
          list->publish_state(over.empty() ? std::string("None over threshold") : over);

esphome:
  # List form so other packages' on_boot entries are appended, not merged.
  on_boot:
    - priority: -100
      then:
        - script.execute: ${ld2410_id}_recover_parameters

interval:
  - interval: 60s
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: ${ld2410_id}_configuration_ready
              - lambda: return !id(${ld2410_id}_recovery_paused);
          then:
            - script.execute: ${ld2410_id}_recover_parameters
