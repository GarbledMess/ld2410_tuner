number:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    timeout:
      id: ${ld2410_id}_timeout
      name: Timeout
      device_id: ${ld2410_device_id}
    max_move_distance_gate:
      id: ${ld2410_id}_max_move
      name: Max Move Distance
      device_id: ${ld2410_device_id}
    max_still_distance_gate:
      id: ${ld2410_id}_max_still
      name: Max Still Distance
      device_id: ${ld2410_device_id}
    g0:
      move_threshold:
        id: ${ld2410_id}_g0_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g0_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g0_still_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g0_still).publish_state(x);
    g1:
      move_threshold:
        id: ${ld2410_id}_g1_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g1_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g1_still_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g1_still).publish_state(x);
    g2:
      move_threshold:
        id: ${ld2410_id}_g2_move_raw
        internal: true
        on_value:
          - lambda: id(${ld2410_id}_g2_move).publish_state(x);
      still_threshold:
        id: ${ld2410_id}_g2_still_raw
        internal: true
        on_value:
