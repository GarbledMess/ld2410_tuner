# Complete, self-contained radar package; include once per LD2410C.
# Keep each node's existing uart pins and host configuration; see docs/esphome-recovery.md.

defaults:
  ld2410_id: ld2410
  ld2410_uart_id: ""
  ld2410_device_id: ""

substitutions:
  ld2410_presence_name: Presence
  ld2410_presence_on_delay: 500ms
  ld2410_presence_off_delay: 1s
  ld2410_sensor_throttle: 1s
  ld2410_gate_throttle: 2s

# A host uart list replaces these single-bus defaults; set all bus options there.
uart:
  baud_rate: 256000
  rx_buffer_size: 1024
  parity: NONE
  stop_bits: 1

ld2410:
  - id: ${ld2410_id}_radar
    uart_id: ${ld2410_uart_id or none}

binary_sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    has_target:
      id: ${ld2410_id}_presence
      name: ${ld2410_presence_name}
      device_id: ${ld2410_device_id}
      filters:
        - delayed_on: ${ld2410_presence_on_delay}
        - delayed_off: ${ld2410_presence_off_delay}
    has_moving_target:
      id: ${ld2410_id}_moving_target
      name: Moving Target
      device_id: ${ld2410_device_id}
    has_still_target:
      id: ${ld2410_id}_still_target
      name: Still Target
      device_id: ${ld2410_device_id}
    out_pin_presence_status:
      id: ${ld2410_id}_out_pin_presence
      name: Out Pin Presence
      device_id: ${ld2410_device_id}

  - platform: template
    id: ${ld2410_id}_configuration_ready
    internal: true
    on_press:
      - globals.set:
          id: ${ld2410_id}_recovery_paused
          value: 'false'
    lambda: |-
      // These settings share the radar's parameter-query response. Checking
      // several fields also avoids trusting a lone optimistic threshold echo.
      return id(${ld2410_id}_g0_move).has_state() && std::isfinite(id(${ld2410_id}_g0_move).state)
          && id(${ld2410_id}_g0_still).has_state() && std::isfinite(id(${ld2410_id}_g0_still).state)
          && id(${ld2410_id}_max_move).has_state() && std::isfinite(id(${ld2410_id}_max_move).state)
          && id(${ld2410_id}_max_still).has_state() && std::isfinite(id(${ld2410_id}_max_still).state)
          && id(${ld2410_id}_timeout).has_state() && std::isfinite(id(${ld2410_id}_timeout).state);

sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    moving_distance:
      id: ${ld2410_id}_moving_distance
      name: Moving Distance
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
    still_distance:
