    ld2410_id: ${ld2410_id}_radar
    distance_resolution:
      id: ${ld2410_id}_distance_resolution
      name: Distance Resolution
      device_id: ${ld2410_device_id}
    baud_rate:
      id: ${ld2410_id}_baud_rate
      name: Baud Rate
      device_id: ${ld2410_device_id}

switch:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    engineering_mode:
      id: ${ld2410_id}_engineering_mode
      name: Engineering Mode
      device_id: ${ld2410_device_id}
    bluetooth:
      id: ${ld2410_id}_bluetooth
      name: Bluetooth
      device_id: ${ld2410_device_id}

text_sensor:
  - platform: template
    id: ${ld2410_id}_recovery_status
    name: LD2410 Recovery Status
    device_id: ${ld2410_device_id}
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (id(${ld2410_id}_configuration_ready).state) return {"Settings available"};
      if (id(${ld2410_id}_recovery_paused)) return {"Paused after failed recovery; use Retry Radar Recovery"};
      if (id(${ld2410_id}_recover_parameters).is_running()) return {"Recovering missing settings"};
      return {"Waiting for settings"};
  # Read-only metadata: these use the exact substitutions wired to the existing
  # filters above. Exposing them does not alter presence or add a new handler.
  - platform: template
    name: LD2410 Presence On Delay
    device_id: ${ld2410_device_id}
    id: ${ld2410_id}_presence_on_delay_info
    entity_category: diagnostic
    lambda: return {"${ld2410_presence_on_delay}"};
    update_interval: 60s
  - platform: template
    name: LD2410 Presence Off Delay
    device_id: ${ld2410_device_id}
    id: ${ld2410_id}_presence_off_delay_info
    entity_category: diagnostic
    lambda: return {"${ld2410_presence_off_delay}"};
    update_interval: 60s
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    version:
      id: ${ld2410_id}_firmware_version
      name: Firmware Version
      device_id: ${ld2410_device_id}
    mac_address:
      id: ${ld2410_id}_mac_address
      name: Mac Address
      device_id: ${ld2410_device_id}

button:
  - platform: template
    id: ${ld2410_id}_retry_recovery
    name: Retry Radar Recovery
    device_id: ${ld2410_device_id}
    entity_category: config
    on_press:
      - if:
          condition:
            not:
              script.is_running: ${ld2410_id}_recover_parameters
          then:
            - globals.set:
                id: ${ld2410_id}_recovery_paused
                value: 'false'
            - script.execute: ${ld2410_id}_recover_parameters
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    query_params:
      id: ${ld2410_id}_query_params
      name: Query Params
      device_id: ${ld2410_device_id}
    restart:
      id: ${ld2410_id}_radar_restart
      name: Radar Restart
      device_id: ${ld2410_device_id}

globals:
  - id: ${ld2410_id}_recovery_paused
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${ld2410_id}_recovery_restarted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${ld2410_id}_last_recovery_restart
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${ld2410_id}_restore_engineering
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: ${ld2410_id}_recover_parameters
    mode: single
    then:
      - if:
          condition:
            lambda: return id(${ld2410_id}_recovery_paused);
          then:
            - script.stop: ${ld2410_id}_recover_parameters
      - delay: 5s
      - repeat: &ld2410_parameter_retries
          count: 3
          then:
            - if:
                condition:
                  binary_sensor.is_off: ${ld2410_id}_configuration_ready
                then:
                  - button.press: ${ld2410_id}_query_params
                  - delay: 2s
      - if:
          condition:
            and:
              - binary_sensor.is_off: ${ld2410_id}_configuration_ready
              - lambda: |-
                  return !id(${ld2410_id}_recovery_restarted)
                      || uint32_t(millis() - id(${ld2410_id}_last_recovery_restart)) >= 60000U;
          then:
            # Start the cooldown before sending, even if the UART is broken.
            # A recurring fault can recover again without rebooting the ESP.
            - globals.set:
                id: ${ld2410_id}_recovery_restarted
                value: 'true'
            - globals.set:
                id: ${ld2410_id}_last_recovery_restart
                value: !lambda return millis();
            - globals.set:
                id: ${ld2410_id}_restore_engineering
                value: !lambda return id(${ld2410_id}_engineering_mode).state;
            - logger.log:
                level: WARN
                format: "LD2410 settings missing; attempting radar restart"
            - button.press: ${ld2410_id}_radar_restart
            # The driver schedules its own reread after one second. Let it
            # finish before sending any further configuration commands.
            - delay: 3s
            - if:
                condition:
                  lambda: return id(${ld2410_id}_restore_engineering);
                then:
                  - switch.turn_on: ${ld2410_id}_engineering_mode
                  - delay: 1s
            - repeat: *ld2410_parameter_retries
      - if:
          condition:
            binary_sensor.is_off: ${ld2410_id}_configuration_ready
          then:
            - globals.set:
                id: ${ld2410_id}_recovery_paused
                value: 'true'
            - logger.log:
                level: WARN
                format: "LD2410 recovery failed; automatic commands paused until settings return or Retry Radar Recovery is pressed"

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: ${ld2410_id}_recover_parameters

interval:
  - interval: 60s
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: ${ld2410_id}_configuration_ready
              - lambda: return !id(${ld2410_id}_recovery_paused);
          then:
            - script.execute: ${ld2410_id}_recover_parameters
