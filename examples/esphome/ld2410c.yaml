# Complete, self-contained radar package; include once per LD2410C.
# Keep each node's existing uart pins and host configuration; see docs/esphome-recovery.md.

defaults:
  ld2410_id: ld2410
  ld2410_uart_id: ""
  ld2410_device_id: ""
  ld2410_name_prefix: ""

substitutions:
  ld2410_presence_name: Presence
  ld2410_presence_on_delay: 500ms
  ld2410_presence_off_delay: 1s
  ld2410_sensor_throttle: 1s
  ld2410_gate_throttle: 2s
  # Initial Gate Rounding value; restored HA setting takes precedence after setup.
  ld2410_gate_rounding: "10"
  # The radar keeps its Bluetooth setting in its own flash. When "true", the first
  # time the radar reports Bluetooth on after each ESP boot, it is turned off
  # (one radar restart). Later toggles from HA are left alone until the next boot.
  # Set "false" to keep whatever the radar has stored.
  ld2410_bluetooth_default_off: "true"
  # Timeout (seconds) a newly installed radar starts at. Applied once, the first time
  # the radar reports its timeout after this firmware is installed; remembered in the
  # ESP's flash, so later values (set from HA or by the tuner's Learn) are kept across
  # reboots. Set "-1" to keep whatever the radar has stored.
  ld2410_timeout_default: "30"

# A host uart list replaces these single-bus defaults; set all bus options there.
uart:
  baud_rate: 256000
  rx_buffer_size: 1024
  parity: NONE
  stop_bits: 1

ld2410:
  - id: ${ld2410_id}_radar
    uart_id: ${ld2410_uart_id or none}

binary_sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    has_target:
      id: ${ld2410_id}_presence
      name: ${ld2410_name_prefix}${ld2410_presence_name}
      device_id: ${ld2410_device_id}
      filters:
        - delayed_on: ${ld2410_presence_on_delay}
        - delayed_off: ${ld2410_presence_off_delay}
    has_moving_target:
      id: ${ld2410_id}_moving_target
      name: ${ld2410_name_prefix}Moving Target
      device_id: ${ld2410_device_id}
      trigger_on_initial_state: true
      on_state:
        - script.execute: ${ld2410_id}_capture_presence_edge
    has_still_target:
      id: ${ld2410_id}_still_target
      name: ${ld2410_name_prefix}Still Target
      device_id: ${ld2410_device_id}
      trigger_on_initial_state: true
      on_state:
        - script.execute: ${ld2410_id}_capture_presence_edge
    out_pin_presence_status:
      id: ${ld2410_id}_out_pin_presence
      name: ${ld2410_name_prefix}Out Pin Presence
      device_id: ${ld2410_device_id}

  - platform: template
    id: ${ld2410_id}_configuration_ready
    internal: true
    on_press:
      - globals.set:
          id: ${ld2410_id}_recovery_paused
          value: 'false'
    lambda: |-
      // These settings share the radar's parameter-query response. Checking
      // several fields also avoids trusting a lone optimistic threshold echo.
      return id(${ld2410_id}_g0_move).has_state() && std::isfinite(id(${ld2410_id}_g0_move).state)
          && id(${ld2410_id}_g0_still).has_state() && std::isfinite(id(${ld2410_id}_g0_still).state)
          && id(${ld2410_id}_max_move).has_state() && std::isfinite(id(${ld2410_id}_max_move).state)
          && id(${ld2410_id}_max_still).has_state() && std::isfinite(id(${ld2410_id}_max_still).state)
          && id(${ld2410_id}_timeout).has_state() && std::isfinite(id(${ld2410_id}_timeout).state);

sensor:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    moving_distance:
      id: ${ld2410_id}_moving_distance
      name: ${ld2410_name_prefix}Moving Distance
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
    still_distance:
      id: ${ld2410_id}_still_distance
      name: ${ld2410_name_prefix}Still Distance
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
    moving_energy:
      id: ${ld2410_id}_moving_energy
      name: ${ld2410_name_prefix}Moving Energy
      accuracy_decimals: 0
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
        - lambda: |-
            if (!std::isfinite(x)) return x;
            return ceilf(fminf(100.0f, fmaxf(0.0f, x)));
    still_energy:
      id: ${ld2410_id}_still_energy
      name: ${ld2410_name_prefix}Still Energy
      accuracy_decimals: 0
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
        - lambda: |-
            if (!std::isfinite(x)) return x;
            return ceilf(fminf(100.0f, fmaxf(0.0f, x)));
    detection_distance:
      id: ${ld2410_id}_detection_distance
      name: ${ld2410_name_prefix}Detection Distance
      device_id: ${ld2410_device_id}
      filters:
        - throttle: ${ld2410_sensor_throttle}
    g0:
      move_energy:
        id: ${ld2410_id}_g0_move_energy
        name: ${ld2410_name_prefix}G0 Move Energy
        accuracy_decimals: 0
        device_id: ${ld2410_device_id}
        filters:
          - throttle: ${ld2410_gate_throttle}
          - lambda: |-
              if (!std::isfinite(x)) return x;
              const float increment = id(${ld2410_id}_gate_rounding).has_state()
                  ? id(${ld2410_id}_gate_rounding).state : ${ld2410_gate_rounding};
              return ceilf(fminf(100.0f, fmaxf(0.0f, roundf(x / increment) * increment)));
          - delta: 1
      still_energy:
        id: ${ld2410_id}_g0_still_energy
        name: ${ld2410_name_prefix}G0 Still Energy
        accuracy_decimals: 0
        device_id: ${ld2410_device_id}
