  # Public controls round writes; internal driver numbers preserve actual readback.
  - platform: template
    id: ${ld2410_id}_g0_move
    name: ${ld2410_name_prefix}G0 Move Threshold
    device_id: ${ld2410_device_id}
    entity_category: config
    min_value: 0
    max_value: 100
    step: ${ld2410_gate_rounding}
    update_interval: never
    lambda: |-
      const float raw = id(${ld2410_id}_g0_move_raw).state;
      if (!std::isfinite(raw)) return raw;
      // Show the rounding band the radar threshold opens, on this control's own grid.
      const float minimum = id(${ld2410_id}_g0_move).traits.get_min_value();
      const float increment = id(${ld2410_id}_g0_move).traits.get_step();
      return fminf(100.0f, fmaxf(0.0f, minimum + roundf((raw + 1.0f - minimum) / increment) * increment));
    set_action:
      - number.set:
          id: ${ld2410_id}_g0_move_raw
          value: !lambda |-
            const float minimum = id(${ld2410_id}_g0_move).traits.get_min_value();
            const float maximum = id(${ld2410_id}_g0_move).traits.get_max_value();
            const float increment = id(${ld2410_id}_g0_move).traits.get_step();
            const float last = minimum + floorf((maximum - minimum) / increment) * increment;
            const float rounded = minimum + roundf((x - minimum) / increment) * increment;
            const float nominal = fminf(last, fmaxf(minimum, rounded));
            // Integer radar threshold: first raw value in the displayed rounding band must pass.
            return nominal <= 0.0f ? 0.0f : fmaxf(0.0f, ceilf(nominal - increment / 2.0f) - 1.0f);

  - platform: template
    id: ${ld2410_id}_g0_still
    name: ${ld2410_name_prefix}G0 Still Threshold
    device_id: ${ld2410_device_id}
    entity_category: config
