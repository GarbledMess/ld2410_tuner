number:
  - platform: ld2410
    ld2410_id: ${ld2410_id}_radar
    timeout:
      id: ${ld2410_id}_timeout
      name: ${ld2410_name_prefix}Timeout
      device_id: ${ld2410_device_id}
      on_value:
        - if:
            condition:
              lambda: return !id(${ld2410_id}_timeout_default_applied) && std::isfinite(x);
            then:
              - globals.set:
                  id: ${ld2410_id}_timeout_default_applied
                  value: 'true'
              - if:
                  condition:
                    lambda: |-
                      const float target = ${ld2410_timeout_default};
                      return target >= 0.0f && x != target;
                  then:
                    - logger.log: "Setting LD2410 timeout to its default (ld2410_timeout_default)"
                    - number.set:
                        id: ${ld2410_id}_timeout
                        value: !lambda return ${ld2410_timeout_default};
    max_move_distance_gate:
      id: ${ld2410_id}_max_move
      name: ${ld2410_name_prefix}Max Move Distance
      device_id: ${ld2410_device_id}
    max_still_distance_gate:
      id: ${ld2410_id}_max_still
      name: ${ld2410_name_prefix}Max Still Distance
      device_id: ${ld2410_device_id}
    g0:
      move_threshold:
        id: ${ld2410_id}_g0_move_raw
        internal: true
        on_value:
          - component.update: ${ld2410_id}_g0_move
      still_threshold:
        id: ${ld2410_id}_g0_still_raw
        internal: true
        on_value:
          - component.update: ${ld2410_id}_g0_still
    g1:
      move_threshold:
        id: ${ld2410_id}_g1_move_raw
        internal: true
        on_value:
          - component.update: ${ld2410_id}_g1_move
      still_threshold:
        id: ${ld2410_id}_g1_still_raw
        internal: true
        on_value:
          - component.update: ${ld2410_id}_g1_still
    g2:
