  # Saved runtime control. Changing it refreshes HA metadata, without radar writes.
  - platform: template
    id: ${ld2410_id}_gate_rounding
    name: Gate Rounding
    device_id: ${ld2410_device_id}
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${ld2410_gate_rounding}
    on_value:
      - lambda: |-
          // Normalize fractional API writes to the same integer shown in HA.
          const float increment = roundf(x);
          if (increment != x) {
            id(${ld2410_id}_gate_rounding).publish_state(increment);
            return;
          }
          number::Number *gates[] = {
            id(${ld2410_id}_g0_move),
            id(${ld2410_id}_g0_still),
            id(${ld2410_id}_g1_move),
            id(${ld2410_id}_g1_still),
            id(${ld2410_id}_g2_move),
            id(${ld2410_id}_g2_still),
            id(${ld2410_id}_g3_move),
            id(${ld2410_id}_g3_still),
            id(${ld2410_id}_g4_move),
            id(${ld2410_id}_g4_still),
            id(${ld2410_id}_g5_move),
            id(${ld2410_id}_g5_still),
            id(${ld2410_id}_g6_move),
            id(${ld2410_id}_g6_still),
            id(${ld2410_id}_g7_move),
            id(${ld2410_id}_g7_still),
            id(${ld2410_id}_g8_move),
            id(${ld2410_id}_g8_still)
          };
          // Capture caller overrides once, before changing any runtime traits.
          static const float configured_steps[] = {
            id(${ld2410_id}_g0_move).traits.get_step(),
            id(${ld2410_id}_g0_still).traits.get_step(),
            id(${ld2410_id}_g1_move).traits.get_step(),
            id(${ld2410_id}_g1_still).traits.get_step(),
            id(${ld2410_id}_g2_move).traits.get_step(),
            id(${ld2410_id}_g2_still).traits.get_step(),
            id(${ld2410_id}_g3_move).traits.get_step(),
            id(${ld2410_id}_g3_still).traits.get_step(),
            id(${ld2410_id}_g4_move).traits.get_step(),
            id(${ld2410_id}_g4_still).traits.get_step(),
            id(${ld2410_id}_g5_move).traits.get_step(),
            id(${ld2410_id}_g5_still).traits.get_step(),
            id(${ld2410_id}_g6_move).traits.get_step(),
            id(${ld2410_id}_g6_still).traits.get_step(),
            id(${ld2410_id}_g7_move).traits.get_step(),
            id(${ld2410_id}_g7_still).traits.get_step(),
            id(${ld2410_id}_g8_move).traits.get_step(),
            id(${ld2410_id}_g8_still).traits.get_step()
          };
          for (size_t i = 0; i < 18; i++) {
            const float step = configured_steps[i] == ${ld2410_gate_rounding}
                ? increment : configured_steps[i];
            gates[i]->traits.set_step(step);
          }
          static float previous = NAN;
          const bool changed = std::isfinite(previous) && previous != increment;
          previous = increment;
          if (changed) id(${ld2410_id}_refresh_rounding_metadata).execute();

